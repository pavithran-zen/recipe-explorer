<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recipe Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f8f6f2;
    }
    h1 {
      margin-bottom: 4px;
    }
    #filters input {
      padding: 8px;
      margin-right: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #filters button {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
    }

    /* The card grid layout */
    #recipeGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .recipe-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .recipe-card:hover {
      transform: translateY(-4px);
    }
    .recipe-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }
    .recipe-card-body {
      padding: 12px;
    }
    .recipe-card-title {
      font-weight: bold;
      margin: 0 0 4px;
      font-size: 15px;
    }
    .recipe-card-meta {
      font-size: 13px;
      color: #777;
    }

    #pagination {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #pagination button {
      padding: 6px 14px;
    }
  </style>
</head>
<body>

  <h1>Recipe Explorer</h1>
  <p>Browse and search recipes.</p>

  <div id="filters">
    <input type="text" id="titleFilter" placeholder="Search by title...">
    <input type="text" id="cuisineFilter" placeholder="Search by cuisine...">
    <button id="searchBtn">Search</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div id="recipeGrid">
    <!-- Cards will be added here by JavaScript -->
  </div>

  <div id="drawerOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4);"></div>

  <div id="drawer" style="display:none; position:fixed; top:0; right:0; width:320px; height:100%; background:white; box-shadow:-2px 0 10px rgba(0,0,0,0.2); padding:20px; overflow-y:auto;">
    <button id="closeDrawerBtn" style="float:right; font-size:20px; border:none; background:none; cursor:pointer;">&times;</button>
    <img id="drawerImage" style="width:100%; height:160px; object-fit:cover; border-radius:8px; margin-bottom:12px;">
    <h2 id="drawerTitle"></h2>
    <p id="drawerCuisine" style="color:#a8752c; font-weight:bold;"></p>

    <p><strong>Description:</strong> <span id="drawerDescription"></span></p>

    <p>
      <strong>Total Time:</strong> <span id="drawerTotalTime"></span>
      <button id="expandTimeBtn" style="cursor:pointer;">▸</button>
    </p>
    <div id="timeDetails" style="display:none; padding-left:15px;">
      <p>Prep Time: <span id="drawerPrepTime"></span></p>
      <p>Cook Time: <span id="drawerCookTime"></span></p>
    </div>

    <h3>Nutrition</h3>
    <table id="nutritionTable" style="width:100%;">
      <!-- filled by JavaScript -->
    </table>
  </div>

  <div id="pagination">
    <button id="prevBtn">Prev</button>
    <span id="pageInfo">Page 1</span>
    <button id="nextBtn">Next</button>

    <label style="margin-left: 20px;">
      Results per page:
      <select id="limitSelect">
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="50">50</option>
      </select>
    </label>
  </div>

  <script src="app.js"></script>
</body>
</html>
